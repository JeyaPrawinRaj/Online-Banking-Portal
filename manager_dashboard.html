<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bank Manager Dashboard - Live Data</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
    body { font-family: Arial, sans-serif; background: #f5f7fa; margin: 0; }
    header { background: #395886; color: #fff; padding: 20px 0; text-align: center; }
    nav { background: #24304e; padding: 10px; display: flex; justify-content: center; flex-wrap: wrap; }
    nav button {
        background: #395886; color: #fff; border: none; margin: 4px;
        padding: 10px 18px; border-radius: 6px; cursor: pointer; font-size: 1em;
    }
    nav button:hover { background: #2a4365; }
    .container { max-width: 1000px; margin: 20px auto; background: #fff;
        border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        padding: 20px; min-height: 500px; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
    th { background: #395886; color: white; }
</style>
</head>
<body>
<header>
  <h1>Bank Manager Dashboard</h1>
  <p>Welcome, Manager! View live banking data below.</p>
</header>

<nav>
  <button onclick="loadAccounts()">Customer Accounts</button>
  <button onclick="loadLoans()">Loan Applications</button>
  <button onclick="loadEmployees()">Employees</button>
  <button onclick="loadTransactions()">Transactions</button>
</nav>

<div class="container" id="dataContainer">
  <h2>Select a module to view data</h2>
</div>

<script>
async function fetchData(api, title) {
  const res = await fetch(`http://localhost:3000${api}`);
  const data = await res.json();
  const container = document.getElementById("dataContainer");

  if (!data.length) {
    container.innerHTML = `<h2>${title}</h2><p>No records found.</p>`;
    return;
  }

  const headers = Object.keys(data[0]);
  const table = `
    <h2>${title}</h2>
    <table>
      <tr>${headers.map(h => `<th>${h}</th>`).join('')}</tr>
      ${data.map(row => `
        <tr>${headers.map(h => `<td>${row[h]}</td>`).join('')}</tr>
      `).join('')}
    </table>`;
  container.innerHTML = table;
}

function loadAccounts() { fetchData('/accounts', 'Customer Accounts'); }
function loadLoans() { fetchData('/loans', 'Loan Applications'); }
function loadEmployees() { fetchData('/employees', 'Employees'); }
function loadTransactions() { fetchData('/transactions', 'Transaction History'); }
</script>
</body>
</html>
