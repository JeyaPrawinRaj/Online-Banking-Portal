<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Loan Application Form</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            margin: 0;
        }

        .container {
            max-width: 500px;
            margin: 40px auto;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .08);
            padding: 36px;
        }

        h2 {
            color: #395886;
        }

        label {
            display: block;
            margin-top: 16px;
            text-align: left;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 8px;
            margin-top: 4px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }

        button {
            background: #395886;
            color: #fff;
            border: none;
            padding: 12px 32px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1.1em;
            margin-top: 24px;
            width: 100%;
        }

        button:hover {
            background: #2a4365;
        }

        #matchResult {
            margin-top: 8px;
            color: #395886;
            font-size: 1em;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Loan Application Form</h2>
        <form id="loanForm">
            <label for="accountNo">Account Number:</label>
            <input type="text" id="accountNo" placeholder="Type your account number..." required>
            <div id="matchResult"></div>

            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname" required>

            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" required>

            <label for="email">Email:</label>
            <input type="email" id="email" required>

            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" required>

            <label for="address">Address:</label>
            <textarea id="address" required></textarea>

            <label for="loanType">Type of Loan:</label>
            <select id="loanType" required>
                <option value="">Select</option>
                <option value="Personal">Personal Loan</option>
                <option value="Home">Home Loan</option>
                <option value="Auto">Auto Loan</option>
                <option value="Education">Education Loan</option>
                <option value="Business">Business Loan</option>
            </select>

            <label for="amount">Loan Amount Requested:</label>
            <input type="number" id="amount" min="1000" required>

            <label for="tenure">Loan Tenure (in months):</label>
            <input type="number" id="tenure" min="6" required>

            <label for="occupation">Occupation:</label>
            <input type="text" id="occupation" required>

            <label for="income">Monthly Income:</label>
            <input type="number" id="income" min="0" required>

            <label for="purpose">Purpose of Loan:</label>
            <textarea id="purpose" required></textarea>

            <button type="submit">Apply for Loan</button>
        </form>
        <div id="result" style="margin-top:24px;color:#395886;"></div>
    </div>
    <script>
        // Simulated account numbers for demonstration. Update as needed.
        let accountNumbers = ["951720230001", "951720230002", "951720230003", "951720230004"];

        // Show matching account number(s) below the input as user types
        document.getElementById('accountNo').addEventListener('input', function () {
            let query = this.value.trim();
            let resultDiv = document.getElementById('matchResult');
            if (query === "") {
                resultDiv.textContent = "";
                return;
            }
            // Find exact matches or partial matches
            let matches = accountNumbers.filter(accNo => accNo.toString().includes(query));
            if (matches.length > 0) {
                resultDiv.textContent = "Matching Account Number(s): " + matches.join(", ");
            } else {
                resultDiv.textContent = "No matching account number found.";
            }
        });

        document.getElementById("loanForm").onsubmit = function (e) {
            e.preventDefault();
            let accNoTyped = document.getElementById('accountNo').value.trim();
            // Only allow submission if the typed account number matches exactly one account
            let matches = accountNumbers.filter(accNo => accNo.toString() === accNoTyped);
            if (matches.length === 1) {
                // Collect ALL details from the form
                let loanApplication = {
                    accountNo: document.getElementById('accountNo').value.trim(),
                    fullname: document.getElementById('fullname').value.trim(),
                    dob: document.getElementById('dob').value,
                    email: document.getElementById('email').value.trim(),
                    phone: document.getElementById('phone').value.trim(),
                    address: document.getElementById('address').value.trim(),
                    loanType: document.getElementById('loanType').value,
                    amount: document.getElementById('amount').value,
                    tenure: document.getElementById('tenure').value,
                    occupation: document.getElementById('occupation').value.trim(),
                    income: document.getElementById('income').value,
                    purpose: document.getElementById('purpose').value.trim(),
                    status: 'pending'
                };
                // Save to localStorage
                let loans = JSON.parse(localStorage.getItem('loanApplications') || '[]');
                loans.push(loanApplication);
                localStorage.setItem('loanApplications', JSON.stringify(loans));
                document.getElementById("result").textContent = "Loan Application Submitted! Our manager will review your application.";
                document.getElementById("loanForm").reset();
                document.getElementById("matchResult").textContent = "";
            } else if (matches.length > 1) {
                document.getElementById("result").textContent = "Multiple matches found. Please enter the exact account number.";
            } else {
                document.getElementById("result").textContent = "No matching account number found. Please check your entry.";
            }
        };
    </script>
</body>

</html>
